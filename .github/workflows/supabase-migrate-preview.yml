name: Supabase Migrate (Preview)

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-migrate-preview
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to Preview Supabase project
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Preview project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes
